syntax = "proto3";
package Jde.Proto;

message Exception{
	uint32 code = 1;
	string what = 2;
	uint32 db_error = 3;//DB::EDbError. 0 (None) covers both 'not a DBException' and 'unclassified' - to a receiver those are the same thing, so no presence bit is needed.
}

message Query{
	string text=1;
	string variables=2;
	bool return_raw=3;
}