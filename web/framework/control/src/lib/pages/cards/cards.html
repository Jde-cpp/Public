<div class="page">
	@if( heading() ){
		<h2 class="page-heading">{{heading()}}</h2>
	}
	<div class="cards">
		@for( c of items(); track c.path ){
			<a [routerLink]="c.path" class="card-link">
				<div class="card" [class]="c.cardClass">
					@if( c.icon ){
						<mat-icon class="card-icon" aria-hidden="true">{{c.icon}}</mat-icon>
					}
					<div class="card-title">{{c.title}}</div>
					@if( c.summary ){
						<div class="card-summary">{{c.summary}}</div>
					}
				</div>
			</a>
		} @empty {
			<div class="cards-empty">Nothing to show here.</div>
		}
	</div>
</div>
