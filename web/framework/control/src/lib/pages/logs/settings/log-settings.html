@if( error() ){
	<p class="load-error">Could not load log settings: {{error()}}</p>
}
@else if( !isLoading() ){
	<mat-toolbar>
		<button matButton="tonal" (click)="save()">Save</button>
		<button matButton="outlined" (click)="cancel()">Cancel</button>
		<span class="restart-hint">Changes take effect when the instance restarts.</span>
	</mat-toolbar>
	<mat-tab-group class="my-content" mat-align-tabs="center" mat-stretch-tabs="false" [selectedIndex]="tabIndex()" (selectedIndexChange)="tabIndex.set($event)" dynamicHeight="true">
		<mat-tab>
			<ng-template mat-tab-label>Binary</ng-template>
			<div class="centered-content">
				<log-tags #binary [tags]="snapshot['binary']" [catalogue]="catalogue()"></log-tags>
			</div>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Remote</ng-template>
			<div class="centered-content">
				<log-tags #remote [tags]="snapshot['appServer']" [catalogue]="catalogue()"></log-tags>
			</div>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Text</ng-template>
			<div class="centered-content">
				<log-tags #text [tags]="snapshot['text']" [catalogue]="catalogue()"></log-tags>
			</div>
		</mat-tab>
	</mat-tab-group>
}
