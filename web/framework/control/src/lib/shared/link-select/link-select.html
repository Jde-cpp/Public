<fieldset>
	<legend>{{placeholder()}}</legend>
	<div style="display: flex;">
	    <mat-chip-listbox style="padding-left:7px;flex-direction: row;flex-wrap: nowrap">
			@for( option of linkValues | keyvalue; track option.key ){
				<mat-chip-option [selected]="selected==option.key" (click)="valueChange( option.key )">{{option.value}}</mat-chip-option>
			}
		</mat-chip-listbox>
	<!--	<div style="width: 200px; height: 20px; display: inline; flex:content; flex-direction: column; background-color:green"></div>
		<div style="width: 200px; height: 20px; background-color:red"></div>-->
		<!-- [(ngModel)]="selected" -->
    <!--no ngDefaultControl: this select is bound by [value]/(selectionChange), and the directive was never applied anyway - link-select does not import FormsModule-->
    <mat-select style="width: 120px;text-align: right" [value]="selected" (selectionChange)="valueChange($event.value)">
			@for( option of options().values | keyvalue; track option.key ){
				<mat-option style="text-align: right" [value]="option.key">{{option.value}}</mat-option>
			}
		</mat-select>
	</div>
</fieldset>
