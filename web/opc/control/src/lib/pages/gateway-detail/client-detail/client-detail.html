<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
	[selectedIndex]="tabIndex"
	(selectedIndexChange)="tabIndexChanged($event)"
	dynamicHeight="true">
	<mat-tab>
		<ng-template mat-tab-label>{{properties().name ?? "Properties"}}</ng-template>
		<ng-template matTabContent>
			<properties [ctor]=ctor [(record)]=properties type=role [schema]=schema></properties>
		</ng-template>
	</mat-tab>
	@if( server ){
		<mat-tab>
			<ng-template mat-tab-label>Connection</ng-template>
			<ng-template matTabContent>
					<server-properties [server]="server"></server-properties>
			</ng-template>
		</mat-tab>
	}
</mat-tab-group>
<div style="display: flex; gap: 20px; margin: 20px;"><!--only Save is filled: three extended fabs gave the destructive Delete the same weight as the primary action-->
	<button tabindex="100" matButton="tonal" (click)="onSubmitClick()" [disabled]="!isChanged()">Save</button>
	<button tabindex="101" matButton="outlined" (click)="onCancelClick()">Cancel</button>
	<!--the only icon in the row, so the trash can still reads as a warning; it also carries the delete/restore state-->
	<button tabindex="102" matButton="outlined" (click)="onDeleteClick()" [disabled]="isNew" [attr.aria-label]="isDeleted ? 'Restore' : 'Delete'">
		<mat-icon>{{isDeleted ? "restore" : "delete"}}</mat-icon>{{isDeleted ? "Restore" : "Delete"}}
	</button>
</div>
