@if( !isLoading() ){
	<mat-tab-group class="my-content" mat-stretch-tabs="false" mat-align-tabs="start"
		[selectedIndex]="tabIndex"
		(selectedIndexChange)="tabIndexChanged($event)">
		<mat-tab>
			<ng-template mat-tab-label>Connections</ng-template>
			<ng-template matTabContent>
				<ql-list [(sideNav)]=sideNav collectionDisplay="Clients"></ql-list>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Logs</ng-template>
			<ng-template matTabContent>
				<log-detail [service]=gateway></log-detail>
			</ng-template>
		</mat-tab>
		<mat-tab>
			<ng-template mat-tab-label>Log Settings</ng-template>
			<ng-template matTabContent>
				@if( instanceId() !== undefined ){
					<log-settings [service]=appService [instanceId]=instanceId()!></log-settings>
				}
				@else{
					<p>No application instance registered for this gateway — log settings are unavailable.</p>
				}
			</ng-template>
		</mat-tab>
	</mat-tab-group>
}
